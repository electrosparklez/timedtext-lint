name: Temporary action bundle build

on:
  push:
    branches: [agent/add-config-discovery]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:action
      - name: Commit synchronized bundle
        shell: bash
        run: |
          if git diff --quiet -- dist/action.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/action.mjs
          git commit -m 'Synchronize action bundle'
          git push
